{% extends "base.html" %}

{% block title %}Password Reset Complete — ProBlog{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="auth-container animate-fade-in">
        <div class="auth-card text-center">
            <div class="auth-header">
                <div class="auth-icon" style="background:linear-gradient(135deg,rgba(52,177,170,0.2),rgba(52,177,170,0.05));">
                    <i class="bi bi-check-circle-fill" style="color:var(--pb-teal);"></i>
                </div>
                <h2>Password Reset Complete</h2>
                <p>Your password has been successfully changed</p>
            </div>

            <div style="background:rgba(52,177,170,0.08);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem;border:1px solid rgba(52,177,170,0.15);">
                <i class="bi bi-shield-check me-2" style="color:var(--pb-teal);font-size:1.2rem;"></i>
                <span style="color:var(--pb-text);font-size:0.9rem;">
                    Your account is now secured with the new password. You can log in now.
                </span>
            </div>

            <a href="{% url 'accounts:login' %}" class="btn btn-pb-primary w-100 py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
