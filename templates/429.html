{% extends 'base.html' %}
{% block title %}Too Many Requests - ProBlog{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body text-center py-5">
                    <div class="display-1 text-warning mb-4">
                        <i class="fas fa-clock"></i>
                    </div>
                    <h1 class="display-4 mb-3">429</h1>
                    <h2 class="h4 mb-3">Too Many Requests</h2>
                    <p class="text-muted mb-4">
                        You have made too many requests in a short period. Please wait a moment before trying again.
                    </p>
                    <a href="{% url 'pages:home' %}" class="btn btn-primary">
                        <i class="fas fa-home"></i> Return Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
