{% extends "customadmin/base.html" %}

{% block admin_content %}
<h3 class="fw-bold mb-3">Delete {{ section.verbose_name }}</h3>

<div class="card-glass p-4" style="max-width: 600px;">
    <p>Are you sure you want to delete <strong>{{ obj }}</strong>? This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-pb-danger">Yes, delete</button>
            <a href="{% url 'customadmin:section_list' section.slug %}" class="btn btn-pb-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
